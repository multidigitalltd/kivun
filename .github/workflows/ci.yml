name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  phpcs:
    name: PHP Code Style (WordPress)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-dev
        working-directory: kivun-center

      - name: Install PHPCS + WPCS
        run: |
          # Allow the WPCS installer plugin; it auto-registers wpcs +
          # PHPCSExtra + PHPCSUtils on installed_paths during install.
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require squizlabs/php_codesniffer wp-coding-standards/wpcs --no-progress

      - name: Verify standard is available
        run: phpcs -i

      - name: Run PHPCS
        run: phpcs --standard=WordPress --extensions=php --ignore=*/vendor/*,*/tests/* kivun-center/

  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check syntax
        run: find kivun-center -name "*.php" -exec php -l {} \; | grep -v "^No syntax errors" && exit 1 || exit 0

  phpunit:
    name: Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.0', '8.2', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
        working-directory: kivun-center

      - name: Run tests
        run: vendor/bin/phpunit
        working-directory: kivun-center

  assets:
    name: Built Assets Match Sources
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build tools
        run: npm ci
        working-directory: kivun-center

      # A release once shipped a stylesheet that did not contain the fix it was
      # released for: the build had failed and the failure was swallowed. The
      # site loads the minified files, so that shipped nothing at all.
      - name: Check the minified assets are current
        run: ./bin/check-assets.sh
        working-directory: kivun-center
