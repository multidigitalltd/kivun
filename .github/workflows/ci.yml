name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  phpcs:
    name: PHP Code Style (WordPress)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-dev
        working-directory: kivun-center

      - name: Install PHPCS + WPCS
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require squizlabs/php_codesniffer wp-coding-standards/wpcs --no-progress
          VENDOR=$(composer global config vendor-dir 2>/dev/null)
          phpcs --config-set installed_paths "$VENDOR/wp-coding-standards/wpcs,$VENDOR/phpcsstandards/phpcsextra,$VENDOR/phpcsstandards/phpcsutils"

      - name: Run PHPCS
        run: phpcs --standard=WordPress --extensions=php --ignore=*/vendor/* kivun-center/

  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check syntax
        run: find kivun-center -name "*.php" -exec php -l {} \; | grep -v "^No syntax errors" && exit 1 || exit 0
